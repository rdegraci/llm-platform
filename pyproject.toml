[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-platform"
version = "0.2.0"
description = "Capability-agnostic LLM tool-calling runtime with a plugin host"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.73.0,<2",
    "python-dotenv>=0.21.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
